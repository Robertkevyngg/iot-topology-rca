name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --cov=src/iot_rca --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/iot_ci_test_pass
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Neo4j Bolt readiness
        env:
          NEO4J_PASSWORD: iot_ci_test_pass
        run: |
          python - <<'PY'
          import asyncio, os, sys
          from neo4j import AsyncGraphDatabase

          async def wait():
              for attempt in range(30):
                  driver = AsyncGraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", os.environ["NEO4J_PASSWORD"]))
                  try:
                      await driver.verify_connectivity()
                      await driver.close()
                      print(f"Neo4j ready after attempt {attempt + 1}")
                      return
                  except Exception as exc:
                      await driver.close()
                      await asyncio.sleep(2)
              sys.exit("Neo4j did not become ready in time")

          asyncio.run(wait())
          PY

      - name: Run Redis + Neo4j integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: iot_ci_test_pass
        run: pytest tests/integration -v
